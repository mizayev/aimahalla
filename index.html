<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f8a85">
<meta name="description" content="Virtual mahalla: har bir a'zoga bitta hovli. Qo'shiling, hovlingizni toping va osmono'par quring!">
<title>Mening mahallam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏘️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a2a;--muted:#5a6b68;--card:rgba(255,253,247,.94);--acc:#1f8a85;--acc2:#c8643b;--line:rgba(29,42,42,.12);--sh:0 6px 24px rgba(20,40,30,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:#c2d49a;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
button{font-family:inherit}
.top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.brand{display:flex;gap:10px;align-items:center;background:var(--card);padding:7px 14px 7px 7px;border-radius:16px;box-shadow:var(--sh);backdrop-filter:blur(8px);min-width:0}
.logo{flex:none;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#1f8a85,#35b9ae);display:grid;place-items:center;font-size:21px}
.brand>div:last-child{min-width:0}
h1{font-family:Unbounded,sans-serif;font-size:15px;margin:0;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{flex:none;display:flex;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--sh)}
.langs button{border:0;background:none;font-weight:800;font-size:12px;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--muted)}
.langs button.on{background:var(--ink);color:#fff}
.under{position:fixed;top:calc(68px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:3}
.searchbox{flex:1;max-width:380px;position:relative;pointer-events:auto}
#q{width:100%;border:0;outline:0;border-radius:14px;padding:12px 14px 12px 40px;font:700 14px Manrope,sans-serif;color:var(--ink);background:var(--card);box-shadow:var(--sh)}
.searchbox svg{position:absolute;left:13px;top:13px;opacity:.55}
#sugg{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:#fffdf7;border-radius:14px;box-shadow:var(--sh);overflow:hidden}
#sugg:empty{display:none}
#sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:11px 14px;font-weight:700;font-size:14px;text-align:left;cursor:pointer;color:var(--ink)}
#sugg button span{color:var(--muted);font-weight:600;font-size:12px;flex:none}
#sugg button:hover{background:#f3ecdb}
#sugg .none{padding:11px 14px;font-size:13px;color:var(--muted);font-weight:600}
.stats{display:flex;gap:6px;pointer-events:auto;margin-left:auto}
.stat{background:var(--card);border-radius:14px;padding:6px 12px;text-align:center;box-shadow:var(--sh);min-width:66px}
.stat b{display:block;font-family:Unbounded,sans-serif;font-size:16px;font-weight:600}
.stat span{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat.online b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fb36b;margin-right:5px;vertical-align:3px;box-shadow:0 0 0 3px rgba(47,179,107,.2)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;background:var(--card);padding:6px;border-radius:18px;box-shadow:var(--sh);max-width:calc(100% - 24px);z-index:3}
.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:800;font-size:13px;cursor:pointer;background:#efe7d3;color:var(--ink);white-space:nowrap;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.btn.primary{background:var(--acc);color:#fff}
.btn.warm{background:var(--acc2);color:#fff}
.btn.danger{background:#f6dcd6;color:#9b2f22}
.btn.wide{width:100%;padding:13px}
.zoom{position:fixed;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:42px;height:42px;border:0;border-radius:12px;background:var(--card);font-weight:800;font-size:18px;box-shadow:var(--sh);cursor:pointer;color:var(--ink)}
.mode{position:fixed;left:12px;bottom:calc(82px + env(safe-area-inset-bottom));font-size:11px;font-weight:800;background:var(--card);padding:7px 10px;border-radius:10px;max-width:min(60%,300px);box-shadow:var(--sh);z-index:2;line-height:1.35}
.mode:empty{display:none}
.mode i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0a526;margin-right:6px;vertical-align:1px}
.panel{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(390px,calc(100% - 24px));background:#fffdf7;border-radius:20px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.22);transition:opacity .2s,transform .2s;z-index:4}
.panel.hidden{opacity:0;pointer-events:none;transform:translate(-50%,14px)}
.ptag{font-weight:800;font-size:11px;color:var(--acc2);text-transform:uppercase;letter-spacing:.07em}
.panel h2{font-family:Unbounded,sans-serif;font-size:20px;font-weight:600;margin:4px 34px 6px 0;word-break:break-word}
.pmeta{font-size:13px;color:var(--muted);font-weight:700;line-height:1.6}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pbtns:empty{display:none}
.x{position:absolute;top:12px;right:12px;border:0;background:#efe7d3;width:30px;height:30px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(20,30,30,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal.hidden{display:none}
.mcard{background:#fffdf7;border-radius:22px;padding:22px 20px 18px;width:min(420px,100%);max-height:86vh;overflow:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.mcard h3{font-family:Unbounded,sans-serif;font-size:18px;font-weight:600;margin:0 36px 6px 0}
.mcard h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc2);margin:18px 0 8px}
.mcard p{font-size:13px;color:var(--muted);margin:0 0 12px;font-weight:600;line-height:1.5}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:700 15px Manrope,sans-serif;margin-bottom:10px;background:#fff;color:var(--ink);outline:0}
.field:focus{border-color:var(--acc)}
.lbl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 5px}
.err{color:#b44a3c;font-size:13px;font-weight:700;min-height:4px;margin-bottom:8px}
.ok{color:var(--acc)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;background:#efe7d3;border-radius:12px;padding:3px;margin:4px 0 14px}
.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:#fffdf7;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.colors button{width:34px;height:34px;border-radius:10px;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.colors button.on{border-color:var(--ink);transform:scale(1.08)}
.toplist button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:11px 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;cursor:pointer;text-align:left;color:var(--ink)}
.toplist button:hover{background:#f6f0e2}
.rank{font-family:Unbounded,sans-serif;width:30px;color:var(--acc2);flex:none}
.toplist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist .fl{color:var(--muted);font-size:12px;flex:none}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
#toast{position:fixed;top:calc(124px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
#feed{position:fixed;right:12px;top:calc(124px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:2;pointer-events:none}
#feed div{background:var(--card);box-shadow:var(--sh);padding:7px 11px;border-radius:11px;font-size:12px;font-weight:800;animation:slide .35s ease;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.night .brand,.night .langs,.night #q,.night .stat,.night .bar,.night .zoom button,.night .mode{background:rgba(24,32,48,.9);color:#eef2f7}
.night .brand p,.night .stat span,.night .langs button{color:#a9b4c4}
.night .langs button.on{background:#eef2f7;color:#182030}
.night .btn:not(.primary):not(.warm){background:#2c3850;color:#eef2f7}
.night .zoom button{color:#eef2f7}
.night .searchbox svg{color:#eef2f7}
.night #feed div{background:rgba(24,32,48,.9);color:#eef2f7}
@media(max-width:560px){
  .stat{min-width:0;padding:6px 9px}.stats .stat:nth-child(2){display:none}
  h1{font-size:13px}.brand p{font-size:11px}
  .btn{padding:10px 11px;font-size:12px}
  .mode{max-width:52%}
  #feed{display:none}
}
</style>
</head>

  for(const k in attrs){const v=attrs[k];
    if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(v!=null&&v!==false)e.setAttribute(k,v===true?"":v);}
  kids.flat().forEach(c=>c!=null&&e.append(c));return e;
}

function hash(str){let h=2166136261;str=String(str);for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function hash2(a,b){let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}

const CELL=44,ZONE=9;
const isRoad=g=>((g%5)+5)%5===0;
let plots=[],plotR=0;
function genPlots(R){const L=[];
  for(let gx=-R;gx<=R;gx++)for(let gy=-R;gy<=R;gy++){
    if(Math.abs(gx)<=ZONE+1&&Math.abs(gy)<=ZONE+1)continue;if(isRoad(gx)||isRoad(gy))continue;
    const d=Math.hypot(gx,gy);if(d>R)continue;L.push({gx,gy,d,a:Math.atan2(gy,gx)});}
  L.sort((p,q)=>p.d-q.d||p.a-q.a);plots=L;}
function ensurePlots(n){if(!plotR){plotR=16;genPlots(plotR)}while(plots.length<n+60){plotR+=6;genPlots(plotR)}}

/* ================= backend ================= */
async function call(path,body,admin){
  const h={"Content-Type":"application/json"};
  if(token)h.Authorization="Bearer "+token;
  if(admin&&adminToken)h["X-Admin-Token"]=adminToken;
  let r;
  try{r=await fetch("/api/"+path,{method:body?"POST":"GET",headers:h,body:body?JSON.stringify(body):undefined})}
  catch(e){const er=new Error("net");er.code="net";throw er}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const er=new Error(j.error||"server");er.code=j.error||"server";er.data=j;throw er}
  return j;
}
const errText=e=>t(e&&e.code)||t("server");

function seed(){

  const sf=["","_uz","07","_tash","_99","bek","2008","_official","777","_sam","_x","01","_bukh",".dev"];
  const r=mulberry(42),out=[],seen=new Set();
  for(let i=0;i<240;i++){let n=fn[Math.floor(r()*fn.length)]+sf[Math.floor(r()*sf.length)];
    if(seen.has(n.toLowerCase()))n+=i;seen.add(n.toLowerCase());
    out.push({id:"s"+i,name:n,floors:r()<.15?Math.ceil(r()*14)*5:1,color:Math.floor(r()*8),slot:i,joined:1700000000000+i*3600e3});}
  return out;
}
const Demo={
  load(){const ex=lsJSON("demoUsers",[]),fl=lsJSON("demoFloors",{}),co=lsJSON("demoColors",{});
    return [...seed(),...ex].map(r=>({...r,floors:Math.max(1,Math.min(MAXF,+fl[r.id]||r.floors||1)),color:co[r.id]??r.color}))},
  join(name,pin,color){
    if(!/^[\p{L}\p{N}_.\-]{2,24}$/u.test(name))throw{code:"name_invalid"};
    if(!/^\d{4,8}$/.test(pin))throw{code:"pin_invalid"};
    if(residents.some(r=>norm(r.name)===norm(name)))throw{code:"name_taken"};
    const ex=lsJSON("demoUsers",[]);const slot=Math.max(239,...residents.map(r=>r.slot))+1;
    const u={id:"u"+Date.now().toString(36),name,floors:1,color,slot,joined:Date.now(),pin};
    ex.push(u);lsSet("demoUsers",JSON.stringify(ex));lsSet("demoMe",u.id);return u.id;},
  login(name,pin){const u=lsJSON("demoUsers",[]).find(x=>norm(x.name)===norm(name));if(!u||u.pin!==pin)throw{code:"bad_login"};lsSet("demoMe",u.id);return u.id},
  build(r){const fl=lsJSON("demoFloors",{});fl[r.id]=r.floors<=1?STEP:Math.min(MAXF,r.floors+STEP);lsSet("demoFloors",JSON.stringify(fl));},

function setResidents(list){residents=list;recompute()}
function upsert(r){const i=residents.findIndex(x=>x.id===r.id);if(i>=0)residents[i]=r;else residents.push(r);recompute()}
function recompute(){
  let maxSlot=-1;for(const r of residents)if(r.slot>maxSlot)maxSlot=r.slot;
  ensurePlots(maxSlot+1);byCell.clear();byId.clear();
  for(const r of residents){r.p=plots[r.slot];if(!r.p)continue;byCell.set(r.p.gx+","+r.p.gy,r);byId.set(r.id,r)}
  $("#pop").textContent=residents.length.toLocaleString();
  $("#towers").textContent=residents.filter(r=>r.floors>1).length.toLocaleString();
  if(selected&&selected.id){const s=byId.get(selected.id);if(s){selected=s;showRes(s,true)}else closePanel()}

}

const s2w=(sx,sy)=>({x:cam.x+(sx-W/2)/cam.s,y:cam.y+(sy-H/2)/cam.s});
const w2s=(wx,wy)=>({x:(wx-cam.x)*cam.s+W/2,y:(wy-cam.y)*cam.s+H/2});
function clampCam(){const m=(plotR+8)*CELL;cam.x=Math.max(-m,Math.min(m,cam.x));cam.y=Math.max(-m,Math.min(m,cam.y))}
function zoomAt(sx,sy,f){const w=s2w(sx,sy);cam.s=Math.max(.16,Math.min(3,cam.s*f));cam.x=w.x-(sx-W/2)/cam.s;cam.y=w.y-(sy-H/2)/cam.s;clampCam();req()}
function flyTo(x,y,s){anim={a:{...cam},b:{x,y,s:s??cam.s},t0:performance.now(),dur:900}}
function stepAnim(now){let k=Math.min(1,(now-anim.t0)/anim.dur);const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  cam.x=anim.a.x+(anim.b.x-anim.a.x)*e;cam.y=anim.a.y+(anim.b.y-anim.a.y)*e;
  cam.s=Math.exp(Math.log(anim.a.s)+(Math.log(anim.b.s)-Math.log(anim.a.s))*e);if(k>=1)anim=null;req()}
const bh=r=>r.floors<=1?9:12+r.floors*2;

/* particles */
let parts=[];
function burst(r){const x=r.p.gx*CELL+CELL/2,y=r.p.gy*CELL+CELL/2-bh(r);const cols=["#f2b705","#ff6b6b","#4ecdc4","#ffffff","#c8643b","#7bd389"];
  for(let i=0;i<70;i++){const a=Math.random()*Math.PI*2,v=1.5+Math.random()*4;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,life:1,c:cols[i%cols.length],s:2+Math.random()*3})}}

function box(x,y,w,d,h,top,front){ctx.fillStyle=front;ctx.fillRect(x,y+d-h,w,h);ctx.fillStyle=top;ctx.fillRect(x,y-h,w,d)}
function shadow(x,y,w,d,h){ctx.fillStyle="rgba(40,60,20,.2)";ctx.fillRect(x+3,y+2,w+Math.min(h*.35,46),d)}
function drawRes(r,x,y,detail,night){
  const ci=Number.isInteger(r.color)?r.color%8:hash(r.name)%8;
  if(r.floors<=1){
    const bx=x+8,by=y+11,w=CELL-16,d=CELL-19,h=9;
    if(!night)shadow(bx,by,w,d,h);box(bx,by,w,d,h,ROOF[ci],"#f1e3c4");
    if(detail){ctx.fillStyle="rgba(0,0,0,.16)";ctx.fillRect(bx,by-h+d/2-1,w,2);ctx.fillStyle="#7a4a2a";ctx.fillRect(bx+w/2-3,by+d-7,6,7);
      ctx.fillStyle=night?"#ffd76a":"#9fd3e6";ctx.fillRect(bx+4,by+d-7,5,4);ctx.fillRect(bx+w-9,by+d-7,5,4)}
  }else{
    const P=TOWER[ci],bx=x+6,by=y+8,w=CELL-12,d=CELL-14,h=bh(r),hh=hash(r.id);
    if(!night)shadow(bx,by,w,d,h);box(bx,by,w,d,h,P[0],P[1]);
    if(detail){for(let yy=by+d-h+5;yy<by+d-5;yy+=6)for(let xx=bx+4;xx<bx+w-4;xx+=6){
        const lit=(hash2(xx*3+hh,yy)&7)<(night?5:3);ctx.fillStyle=lit?(night?"#ffd76a":"#ffe9a8"):"rgba(255,255,255,.3)";ctx.fillRect(xx,yy,3,3)}
      ctx.fillStyle="rgba(255,255,255,.35)";ctx.fillRect(bx+3,by-h+3,w-6,2);
      if(r.floors>=40){ctx.strokeStyle="#555";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(bx+w/2,by-h+d/2);ctx.lineTo(bx+w/2,by-h+d/2-14);ctx.stroke();ctx.fillStyle="#f33";ctx.fillRect(bx+w/2-1.5,by-h+d/2-16,3,3)}}
  }
}
function tree(x,y,big){const r=big?9:7;ctx.fillStyle="rgba(40,60,20,.2)";ctx.beginPath();ctx.ellipse(x+3,y+r*.7,r,r*.55,0,0,7);ctx.fill();
  ctx.fillStyle="#5e8f3e";ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.fillStyle="#76a84f";ctx.beginPath();ctx.arc(x-2,y-2,r*.6,0,7);ctx.fill()}
function drawLandmark(lm,detail,night){
  const x=lm.gx*CELL+5,y=lm.gy*CELL+5,w=lm.w*CELL-10,d=lm.h*CELL-10;
  if(lm.k==="park"){const cx=x+w/2,cy=y+d/2,R=w/2;
    ctx.fillStyle="#93c46a";ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();
    ctx.strokeStyle="#f5ecd6";ctx.lineWidth=7;ctx.beginPath();ctx.arc(cx,cy,R*.62,0,7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-R,cy);ctx.lineTo(cx+R,cy);ctx.moveTo(cx,cy-R);ctx.lineTo(cx,cy+R);ctx.stroke();
    ctx.fillStyle="#d8cfb8";ctx.beginPath();ctx.arc(cx,cy,30,0,7);ctx.fill();
    const ph=performance.now()/600;ctx.fillStyle="#5fb7d6";ctx.beginPath();ctx.arc(cx,cy,24,0,7);ctx.fill();
    ctx.fillStyle="#a8e1f2";ctx.beginPath();ctx.arc(cx,cy,9+Math.sin(ph)*2,0,7);ctx.fill();
    for(let i=0;i<10;i++){const a=i/10*Math.PI*2+.3;tree(cx+Math.cos(a)*R*.82,cy+Math.sin(a)*R*.82,i%2)}return}
  if(!night)shadow(x,y,w,d,lm.ht);box(x,y,w,d,lm.ht,lm.c[0],lm.c[1]);const ty=y-lm.ht;
  if(lm.k==="hall"){ctx.fillStyle="#2a9d97";ctx.beginPath();ctx.arc(x+w/2,ty+d/2,Math.min(w,d)*.3,0,7);ctx.fill();ctx.fillStyle="#7fd6cf";ctx.beginPath();ctx.arc(x+w/2-4,ty+d/2-4,Math.min(w,d)*.12,0,7);ctx.fill()}
  if(lm.k==="bazaar")for(let i=0;i<w;i+=12){ctx.fillStyle=(i/12)%2?"#b44a3c":"#f6efe2";ctx.fillRect(x+i,ty,Math.min(12,w-i),d)}
  if(lm.k==="wed"){ctx.strokeStyle="#fff6d6";ctx.lineWidth=3;ctx.strokeRect(x+5,ty+5,w-10,d-10)}
  if(lm.k==="it"&&detail){for(let yy=y+d-lm.ht+6;yy<y+d-4;yy+=7){ctx.fillStyle=(yy/7|0)%3?"rgba(255,255,255,.28)":(night?"#7ffff2":"#d6fffb");ctx.fillRect(x+4,yy,w-8,3)}
    ctx.strokeStyle="#444";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+w/2,ty+d/2);ctx.lineTo(x+w/2,ty+d/2-26);ctx.stroke();ctx.fillStyle="#f33";ctx.beginPath();ctx.arc(x+w/2,ty+d/2-27,3,0,7);ctx.fill()}
  if(lm.k!=="it"&&lm.k!=="hall"&&detail){ctx.fillStyle=night?"rgba(255,215,106,.85)":"rgba(255,255,255,.22)";for(let xx=x+8;xx<x+w-8;xx+=14)ctx.fillRect(xx,y+d-lm.ht+5,7,Math.max(3,lm.ht-12))}
  if(detail){ctx.font="22px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(lm.ic,x+w/2,ty+d/2+(lm.k==="hall"?d*.36:0))}
}
function pill(text,x,y,bg,fg,bold){ctx.font=(bold?"800 ":"700 ")+"12px Manrope, sans-serif";const w=ctx.measureText(text).width+14,h=20;
  ctx.fillStyle=bg;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x-w/2,y-h,w,h,8);else ctx.rect(x-w/2,y-h,w,h);ctx.fill();
  ctx.fillStyle=fg;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(text,x,y-h/2+.5)}

function draw(){
  const s=cam.s,night=isNight();
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=night?"#33402f":"#c2d49a";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(dpr*s,0,0,dpr*s,dpr*(W/2-cam.x*s),dpr*(H/2-cam.y*s));
  const tl=s2w(0,0),br=s2w(W,H);
  const gx0=Math.floor(tl.x/CELL)-1,gx1=Math.floor(br.x/CELL)+1,gy0=Math.floor(tl.y/CELL)-1,gy1=Math.floor(br.y/CELL)+5;
  const detail=s>.45,lim=plotR+2,C=CELL+.6;
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){
    const x=gx*CELL,y=gy*CELL;
    if(Math.abs(gx)<=ZONE&&Math.abs(gy)<=ZONE){ctx.fillStyle="#eadcbc";ctx.fillRect(x,y,C,C);continue}
    if(Math.hypot(gx,gy)>lim){ctx.fillStyle=((Math.floor(gx/2)+Math.floor(gy/3))&1)?"#b6cb85":"#bdd18f";ctx.fillRect(x,y,C,C);continue}
    const rx=isRoad(gx),ry=isRoad(gy);
    if(rx||ry){ctx.fillStyle="#8d929a";ctx.fillRect(x,y,C,C);
      if(detail){ctx.fillStyle="#f2efe6";if(rx&&!ry)ctx.fillRect(x+CELL/2-1,y+CELL*.2,2,CELL*.6);else if(ry&&!rx)ctx.fillRect(x+CELL*.2,y+CELL/2-1,CELL*.6,2)}continue}
    ctx.fillStyle=((gx+gy)&1)?"#a8cb78":"#a2c672";ctx.fillRect(x,y,C,C);
    if(detail){ctx.strokeStyle="rgba(255,255,255,.35)";ctx.lineWidth=1;ctx.strokeRect(x+3,y+3,CELL-6,CELL-6)}
  }
  const Z=(ZONE+1)*CELL;
  if(gx0*CELL<Z&&gx1*CELL>-Z&&gy0*CELL<Z&&gy1*CELL>-Z){ctx.fillStyle="#f5ecd6";
    ctx.fillRect(-ZONE*CELL,-CELL*.35+CELL/2,(2*ZONE+1)*CELL,CELL*.7);ctx.fillRect(-CELL*.35+CELL/2,-ZONE*CELL,CELL*.7,(2*ZONE+1)*CELL);
    ctx.strokeStyle="#d4c49e";ctx.lineWidth=3;ctx.strokeRect(-ZONE*CELL+2,-ZONE*CELL+2,(2*ZONE+1)*CELL-4,(2*ZONE+1)*CELL-4)}
  if(night){ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="rgba(14,24,62,.55)";ctx.fillRect(0,0,cv.width,cv.height);ctx.restore()}
  const my=mine();
  for(let gy=gy0;gy<=gy1;gy++){
    for(const lm of LM)if(lm.gy+lm.h-1===gy){if(night){ctx.save();ctx.globalAlpha=.78;drawLandmark(lm,detail,true);ctx.restore()}else drawLandmark(lm,detail,false)}
    for(let gx=gx0;gx<=gx1;gx++){
      const x=gx*CELL,y=gy*CELL,r=byCell.get(gx+","+gy);
      if(r){if(r===selected||r===my){ctx.strokeStyle=r===selected?"#fff":"#f2b705";ctx.lineWidth=r===selected?3+Math.sin(performance.now()/180)*1.2:3;ctx.strokeRect(x+3,y+3,CELL-6,CELL-6)}
        if(night){ctx.save();ctx.globalAlpha=.82;drawRes(r,x,y,detail,true);ctx.restore();if(detail&&r.floors>1)lightsOnly(r,x,y)}else drawRes(r,x,y,detail,false);continue}
      if(Math.abs(gx)<=ZONE+1&&Math.abs(gy)<=ZONE+1)continue;
      const far=Math.hypot(gx,gy)>lim;
      if(!far&&(isRoad(gx)||isRoad(gy))){if(night&&detail&&isRoad(gx)&&isRoad(gy))ctx.drawImage(glow,x-10,y-10,CELL+20,CELL+20);continue}
      const hv=hash2(gx,gy);if(far?hv%4===0:hv%9===0){if(night){ctx.save();ctx.globalAlpha=.6}tree(x+CELL/2+(hv%9)-4,y+CELL/2+((hv>>4)%9)-4,hv&1);if(night)ctx.restore()}
    }
  }
  if(parts.length){for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}ctx.globalAlpha=1}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(s>=.3)for(const lm of LM){const p=w2s((lm.gx+lm.w/2)*CELL,lm.gy*CELL-lm.ht+2);pill(lm.ic+" "+t("lm_"+lm.k),p.x,p.y,"rgba(29,42,42,.82)","#fff",true)}
  const showAll=s>=1.7;
  for(const r of residents){const isSel=r===selected,isMine=r===my;if(!showAll&&!isSel&&!isMine)continue;
    const g=r.p;if(!g||g.gx<gx0||g.gx>gx1||g.gy<gy0||g.gy>gy1)continue;
    const p=w2s(g.gx*CELL+CELL/2,g.gy*CELL+(r.floors>1?8:11)-bh(r)-2);
    const nm=(isSel||isMine||r.name.length<=12)?r.name:r.name.slice(0,11)+"…";
    pill((isMine?"⭐ ":"")+nm,p.x,p.y,isSel?"#1f8a85":isMine?"#f2b705":"rgba(255,253,247,.92)",isSel?"#fff":"#1d2a2a",isSel||isMine)}
}
function lightsOnly(r,x,y){const bx=x+6,by=y+8,w=CELL-12,d=CELL-14,h=bh(r),hh=hash(r.id);ctx.fillStyle="#ffd76a";
  for(let yy=by+d-h+5;yy<by+d-5;yy+=6)for(let xx=bx+4;xx<bx+w-4;xx+=6)if((hash2(xx*3+hh,yy)&7)<5)ctx.fillRect(xx,yy,3,3)}
let lastT=0;
function loop(now){const dt=Math.min(50,now-(lastT||now))/16.7;lastT=now;
  if(anim)stepAnim(now);
  if(parts.length){for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.12*dt;p.life-=.012*dt}parts=parts.filter(p=>p.life>0);dirty=true}
  if(selected&&now-selAt<5000)dirty=true;
  if(dirty){dirty=false;draw()}requestAnimationFrame(loop)}

/* ================= input ================= */
const ptr=new Map();let gesture=null;
cv.addEventListener("pointerdown",e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});anim=null;
  if(ptr.size===1)gesture={tap:true,sx:e.clientX,sy:e.clientY};else if(gesture)gesture.tap=false;cv.style.cursor="grabbing";$("#sugg").replaceChildren();$("#q").blur()});
cv.addEventListener("pointermove",e=>{const prev=ptr.get(e.pointerId);if(!prev)return;const cur={x:e.clientX,y:e.clientY};
  if(ptr.size===1){cam.x-=(cur.x-prev.x)/cam.s;cam.y-=(cur.y-prev.y)/cam.s;clampCam();if(gesture&&Math.hypot(cur.x-gesture.sx,cur.y-gesture.sy)>6)gesture.tap=false}
  else if(ptr.size===2){const ids=[...ptr.keys()],o=ptr.get(ids[0]===e.pointerId?ids[1]:ids[0]);
    const d0=Math.hypot(prev.x-o.x,prev.y-o.y),d1=Math.hypot(cur.x-o.x,cur.y-o.y);
    const m0x=(prev.x+o.x)/2,m0y=(prev.y+o.y)/2,m1x=(cur.x+o.x)/2,m1y=(cur.y+o.y)/2;
    cam.x-=(m1x-m0x)/cam.s;cam.y-=(m1y-m0y)/cam.s;if(d0>0)zoomAt(m1x,m1y,d1/d0)}
  ptr.set(e.pointerId,cur);req()});
function up(e,cancel){if(!ptr.has(e.pointerId))return;ptr.delete(e.pointerId);if(ptr.size===0){if(!cancel&&gesture&&gesture.tap)onTap(e.clientX,e.clientY);gesture=null;cv.style.cursor="grab"}}
cv.addEventListener("pointerup",e=>up(e,false));cv.addEventListener("pointercancel",e=>up(e,true));
cv.addEventListener("wheel",e=>{e.preventDefault();anim=null;zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0016))},{passive:false});
$("#zin").onclick=()=>zoomAt(W/2,H/2,1.35);$("#zout").onclick=()=>zoomAt(W/2,H/2,1/1.35);$("#zc").onclick=()=>flyTo(CELL/2,CELL/2,.7);
function onTap(sx,sy){const w=s2w(sx,sy),gx=Math.floor(w.x/CELL),gy=Math.floor(w.y/CELL);
  for(let k=6;k>=0;k--){const r=byCell.get(gx+","+(gy+k));if(!r)continue;if(w.y>=(gy+k)*CELL+8-bh(r)&&w.y<=(gy+k+1)*CELL)return showRes(r)}
  for(const lm of LM){if(w.x>=lm.gx*CELL&&w.x<(lm.gx+lm.w)*CELL&&w.y>=lm.gy*CELL-lm.ht&&w.y<(lm.gy+lm.h)*CELL)return showLm(lm)}
  closePanel()}

/* ================= panel ================= */
let tick=null;
function openPanel(){$("#panel").classList.remove("hidden")}
function closePanel(){$("#panel").classList.add("hidden");selected=null;clearInterval(tick);tick=null;req()}
$("#pClose").onclick=closePanel;
function showLm(lm){selected=null;clearInterval(tick);tick=null;$("#pTag").textContent=t("landmark");$("#pName").textContent=lm.ic+" "+t("lm_"+lm.k);$("#pMeta").textContent=t("lmd_"+lm.k);$("#pBtns").replaceChildren();openPanel();req()}
function showRes(r,quiet){
  if(!quiet){selected=r;selAt=performance.now()}
  const isMine=mine()===r;
  $("#pTag").textContent=(isMine?t("mine")+" · ":"")+"№ "+(r.slot+1)+" "+t("plot");
  $("#pName").textContent=r.name;
  const meta=$("#pMeta");meta.replaceChildren(el("div",{text:r.floors>1?`${t("tower")} · ${r.floors} ${t("floors")}`:t("house")}));
  if(r.joined>1e11)meta.append(el("div",{text:`${t("since")}: ${fmtDate(r.joined)}`}));
  const b=$("#pBtns");b.replaceChildren();clearInterval(tick);tick=null;
  if(isMine){
    const bb=el("button",{class:"btn warm",onclick:()=>build(r)});
    const upd=()=>{const left=nextBuildAt-Date.now();
      if(r.floors>=MAXF){bb.disabled=true;bb.textContent="🏆 "+r.floors+" "+t("floors")}
      else if(left>0){bb.disabled=true;bb.textContent=t("nextBuild")+" "+fmtLeft(left)}
      else{bb.disabled=false;bb.textContent=r.floors>1?t("addFloors"):t("build")}};
    upd();tick=setInterval(upd,15000);
    b.append(bb,el("button",{class:"btn",text:t("share"),onclick:()=>share(r)}),el("button",{class:"btn",text:t("paint"),onclick:()=>openPaint(r)}),el("button",{class:"btn",text:t("logout"),onclick:logout}));
  }
  if(live&&isAdmin){
    b.append(el("button",{class:"btn",text:t("plus"),onclick:()=>adminFloors(r,STEP)}),el("button",{class:"btn",text:t("minus"),onclick:()=>adminFloors(r,-STEP)}),
      el("button",{class:"btn danger",text:t("remove"),onclick:ev=>{const bt=ev.currentTarget;if(bt.dataset.c)adminRemove(r);else{bt.dataset.c="1";bt.textContent=t("confirmRemove")}}}));
  }
  openPanel();req();
}
function focusRes(r){if(!r.p)return;flyTo(r.p.gx*CELL+CELL/2,r.p.gy*CELL+CELL/2-bh(r)/2,Math.max(cam.s,1.35));showRes(r)}

/* ================= search ================= */
const q=$("#q"),sugg=$("#sugg");
q.addEventListener("input",renderSugg);q.addEventListener("focus",renderSugg);
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=sugg.querySelector("button");if(f)f.click()}if(e.key==="Escape"){q.blur();sugg.replaceChildren()}});
function renderSugg(){const v=norm(q.value);sugg.replaceChildren();if(!v)return;
  const m=residents.filter(r=>norm(r.name).includes(v)).sort((a,b)=>(norm(a.name).startsWith(v)?0:1)-(norm(b.name).startsWith(v)?0:1)||a.slot-b.slot).slice(0,8);
  if(!m.length){sugg.append(el("div",{class:"none",text:t("notFound")}));return}
  m.forEach(r=>sugg.append(el("button",{onclick:()=>{q.value=r.name;sugg.replaceChildren();q.blur();focusRes(r)}},r.name,el("span",{text:"№ "+(r.slot+1)}))))}

/* ================= modal ================= */
const modal=$("#modal"),mcard=$("#mcard");
function openModal(...kids){mcard.replaceChildren(el("button",{class:"x",text:"✕",onclick:closeModal}),...kids);modal.classList.remove("hidden")}
function closeModal(){modal.classList.add("hidden")}
modal.addEventListener("pointerdown",e=>{if(e.target===modal)closeModal()});
function colorPicker(sel,onPick){const box=el("div",{class:"colors"});
  ROOF.forEach((c,i)=>{const b=el("button",{type:"button",class:i===sel?"on":"",style:`background:${c}`,"aria-label":"color "+(i+1),onclick:()=>{box.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on");onPick(i)}});box.append(b)});return box}

function openAuth(tab){
  let color=Math.floor(Math.random()*8);
  const name=el("input",{class:"field",maxlength:"24",autocomplete:"username",autocapitalize:"off",spellcheck:"false"});
  const pin=el("input",{class:"field",type:"password",inputmode:"numeric",maxlength:"8",autocomplete:tab==="join"?"new-password":"current-password"});
  const err=el("div",{class:"err"});
  const go=el("button",{class:"btn primary wide",text:tab==="join"?t("joinGo"):t("loginGo")});
  const submit=async()=>{
    const n=name.value.trim().replace(/^@/,""),p=pin.value.trim();err.textContent="";go.disabled=true;
    try{
      if(live){const res=await call(tab,{name:n,pin:p,color});token=res.token;lsSet("tok",token);setMe(res);if(res.me)upsert(res.me)}
      else{meId=tab==="join"?Demo.join(n,p,color):Demo.login(n,p);nextBuildAt=0;setResidents(Demo.load())}
      closeModal();const r=mine();
      if(r){focusRes(r);if(tab==="join"){toast(t("joinedToast")+(r.slot+1)+" 🎉");setTimeout(()=>burst(r),700)}else toast(t("welcomeBack")+" "+r.name+"!")}
    }catch(e){err.textContent=errText(e)}finally{go.disabled=false}};
  go.onclick=submit;[name,pin].forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter")submit()}));
  const tabs=el("div",{class:"tabs"},el("button",{class:tab==="join"?"on":"",text:t("join"),onclick:()=>openAuth("join")}),el("button",{class:tab==="login"?"on":"",text:t("login"),onclick:()=>openAuth("login")}));
  openModal(el("h3",{text:t("joinTitle")}),tabs,el("p",{text:tab==="join"?t("joinHint"):t("loginHint")}),
    el("label",{class:"lbl",text:t("nick")}),name,el("label",{class:"lbl",text:t("pin")}),pin,
    tab==="join"?[el("label",{class:"lbl",text:t("color")}),colorPicker(color,i=>color=i)]:null,err,go);
  setTimeout(()=>name.focus(),60);
}
function setMe(res){meId=res.me.id;nextBuildAt=res.nextBuildAt||0;if(res.step)STEP=res.step;if(res.maxFloors)MAXF=res.maxFloors;updateBar()}
async function logout(){if(live){try{await call("logout",{})}catch(e){}}token="";lsSet("tok",null);lsSet("demoMe",null);meId=null;closePanel();updateBar();req();toast(t("loggedOut"))}
async function build(r){
  try{
    if(live){const res=await call("build",{});setMe(res);upsert(res.me)}
    else{Demo.build(r);setResidents(Demo.load())}
    const m=mine();if(m){showRes(m);burst(m);toast(`${t("built")} ${m.floors} ${t("floors")} 🏙️`)}
  }catch(e){if(e.data&&e.data.me)setMe(e.data);toast(errText(e));const m=mine();if(m)showRes(m,true)}
}
function openPaint(r){openModal(el("h3",{text:t("paint")}),colorPicker(r.color,async i=>{
  try{if(live){const res=await call("color",{color:i});upsert(res.me)}else{Demo.color(r,i);setResidents(Demo.load())}}catch(e){toast(errText(e))}}))}
function shareUrl(r){const u=new URL(location.href);u.search="";u.hash="";u.searchParams.set("u",r.name);return u.toString()}
async function share(r){const url=shareUrl(r);
  try{await navigator.clipboard.writeText(url);toast(t("copied"));return}catch(e){}
  const inp=el("input",{class:"field",readonly:true});inp.value=url;openModal(el("h3",{text:t("shareTitle")}),el("p",{text:t("shareHint")}),inp);setTimeout(()=>inp.select(),60)}
function openTop(which){
  which=which||"tallest";
  const list=which==="tallest"?[...residents].sort((a,b)=>b.floors-a.floors||a.slot-b.slot).slice(0,20):[...residents].sort((a,b)=>b.joined-a.joined).slice(0,20);
  const box=el("div",{class:"toplist"});
  list.forEach((r,i)=>box.append(el("button",{onclick:()=>{closeModal();focusRes(r)}},el("span",{class:"rank",text:i+1}),el("span",{class:"dot",style:`background:${ROOF[(r.color??0)%8]}`}),el("span",{class:"nm",text:r.name}),
    el("span",{class:"fl",text:which==="tallest"?(r.floors>1?`${r.floors} ${t("floors")}`:"🏠"):fmtDate(r.joined)}))));
  const tabs=el("div",{class:"tabs"},el("button",{class:which==="tallest"?"on":"",text:t("tallest"),onclick:()=>openTop("tallest")}),el("button",{class:which==="newest"?"on":"",text:t("newest"),onclick:()=>openTop("newest")}));
  openModal(el("h3",{text:t("topTitle")}),tabs,box)}
$("#bMine").onclick=()=>{const r=mine();if(r)focusRes(r);else openAuth("join")};
$("#bTop").onclick=()=>openTop();
$("#bAdmin").onclick=openAdmin;

/* ================= admin ================= */
async function adminFloors(r,delta){const nf=Math.max(1,Math.min(MAXF,(r.floors<=1&&delta>0?0:r.floors)+delta));if(nf===r.floors)return;
  try{await call("admin/floors",{id:r.id,floors:nf},true)}catch(e){toast(errText(e))}}
async function adminRemove(r){try{await call("admin/remove",{id:r.id},true);closePanel()}catch(e){toast(errText(e))}}
function openAdminLogin(){
  const pw=el("input",{class:"field",type:"password",autocomplete:"current-password"}),err=el("div",{class:"err"});
  const go=async()=>{try{const r=await call("admin/login",{password:pw.value});adminToken=r.adminToken;lsSet("adm",adminToken);isAdmin=true;updateBar();closeModal();openAdmin()}catch(e){err.textContent=errText(e)}};
  pw.addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  openModal(el("h3",{text:t("adminTitle")}),el("label",{class:"lbl",text:t("adminLogin")}),pw,err,el("button",{class:"btn primary wide",text:t("login"),onclick:go}));setTimeout(()=>pw.focus(),60)}
function openAdmin(){
  const ti=el("input",{class:"field",maxlength:"40"});ti.value=config.title||"";
  const tg=el("input",{class:"field",maxlength:"60"});tg.value=config.tagline||"";
  const msg=el("div",{class:"err ok"});
  openModal(el("h3",{text:t("adminTitle")}),el("h4",{text:t("settings")}),el("label",{class:"lbl",text:t("titleField")}),ti,el("label",{class:"lbl",text:t("taglineField")}),tg,msg,
    el("div",{class:"row"},el("button",{class:"btn",text:t("adminOut"),onclick:()=>{adminToken="";lsSet("adm",null);isAdmin=false;updateBar();closeModal();if(selected)showRes(selected,true)}}),
      el("button",{class:"btn primary",text:t("save"),onclick:async()=>{try{await call("admin/config",{title:ti.value,tagline:tg.value},true);msg.textContent=t("saved")}catch(e){msg.textContent=errText(e)}}})))}

/* ================= live connection ================= */
let es=null;
function applyState(s){config=s.config||config;if(s.step)STEP=s.step;if(s.maxFloors)MAXF=s.maxFloors;setOnline(s.online);setResidents(s.residents||[]);applyLang()}
function setOnline(n){if(n==null)return;$("#onlineBox").hidden=false;$("#online").textContent=n}
function openEvents(){
  if(!window.EventSource)return;es=new EventSource("/api/events");let dropped=false;
  es.onerror=()=>{dropped=true};
  es.onopen=async()=>{if(dropped){dropped=false;try{applyState(await call("state"))}catch(e){}}};
  es.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==="upsert"&&m.r){const old=byId.get(m.r.id);upsert(m.r);
      if(m.isNew&&m.r.id!==meId)feed("🏠 "+m.r.name+" — "+t("newNeighbor"));
      else if(old&&m.r.floors>old.floors&&m.r.id!==meId)feed("🏗️ "+m.r.name+": "+m.r.floors+" "+t("builtFeed"))}
    else if(m.type==="remove"){residents=residents.filter(r=>r.id!==m.id);if(m.id===meId){meId=null;token="";lsSet("tok",null)}recompute()}
    else if(m.type==="config"){config=m.config||config;applyLang()}
    else if(m.type==="online")setOnline(m.n)};
}
async function start(){
  try{
    const s=await call("state");live=true;applyState(s);openEvents();
    if(token){try{setMe(await call("me"))}catch(e){if(e.code==="auth"){token="";lsSet("tok",null)}}}
    if(adminToken){try{await call("admin/check",{},true);isAdmin=true}catch(e){if(e.code==="auth"){adminToken="";lsSet("adm",null)}}}
    if(/[?&]admin\b/.test(location.search)||location.hash==="#admin"){isAdmin?openAdmin():openAdminLogin()}
  }catch(e){
    live=false;meId=lsGet("demoMe");setResidents(Demo.load());if(meId&&!byId.has(meId))meId=null;
    const m=$("#mode");m.replaceChildren(el("i"),document.createTextNode(t("demo")));
  }
  updateBar();recompute();
  const want=new URLSearchParams(location.search).get("u");
  const target=want?residents.find(r=>norm(r.name)===norm(want)):mine();
  if(target)setTimeout(()=>focusRes(target),350);
}

/* ================= language ================= */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  const ttl=config.title||t("title");$("#title").textContent=ttl;document.title=ttl;
  $("#tagline").textContent=config.tagline||t("tagline");q.placeholder=t("search");
  if(!live&&$("#mode").childNodes.length)$("#mode").replaceChildren(el("i"),document.createTextNode(t("demo")));
  updateBar();req();
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;lsSet("lang",lang);applyLang();if(selected)showRes(selected,true)});

resize();applyNight();applyLang();ensurePlots(0);requestAnimationFrame(loop);start();
setInterval(()=>{if(nightPref==null)applyNight()},60000);
})();
</script>
