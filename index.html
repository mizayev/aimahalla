<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b3df5">
<!--OG--><title>AI Mahalla</title>
<meta name="description" content="Har bir a'zoga bitta hovli. Qo'shiling, hovli oling va osmono'par quring!">
<meta property="og:title" content="AI Mahalla">
<meta property="og:description" content="Har bir a'zoga bitta hovli. Qo'shiling, hovli oling va osmono'par quring!">
<meta property="og:type" content="website"><!--/OG-->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2a2a;--muted:#5a6b68;--card:rgba(255,253,247,.94);--acc:#1f8a85;--acc2:#c8643b;--ai1:#6d4aff;--ai2:#1fb6c9;--line:rgba(29,42,42,.12);--sh:0 6px 24px rgba(20,40,30,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:#c2d49a;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
button{font-family:inherit}
#gl{cursor:grab}
#ov{pointer-events:none}
.top{position:fixed;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none;z-index:3}
.top>*{pointer-events:auto}
.brand{display:flex;gap:10px;align-items:center;background:var(--card);padding:7px 14px 7px 7px;border-radius:16px;box-shadow:var(--sh);backdrop-filter:blur(8px);min-width:0}
.logo{flex:none;width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--ai1),var(--ai2));display:grid;place-items:center;font-size:21px;box-shadow:0 0 0 3px rgba(109,74,255,.15)}
.brand>div:last-child{min-width:0}
h1{font-family:Unbounded,sans-serif;font-size:15px;margin:0;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:2px 0 0;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{flex:none;display:flex;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--sh)}
.langs button{border:0;background:none;font-weight:800;font-size:12px;padding:7px 9px;border-radius:9px;cursor:pointer;color:var(--muted)}
.langs button.on{background:var(--ink);color:#fff}
.under{position:fixed;top:calc(68px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:3}
.searchbox{flex:1;max-width:380px;position:relative;pointer-events:auto}
#q{width:100%;border:0;outline:0;border-radius:14px;padding:12px 14px 12px 40px;font:700 14px Manrope,sans-serif;color:var(--ink);background:var(--card);box-shadow:var(--sh)}
.searchbox svg{position:absolute;left:13px;top:13px;opacity:.55}
#sugg{position:absolute;top:100%;left:0;right:0;margin-top:6px;background:#fffdf7;border-radius:14px;box-shadow:var(--sh);overflow:hidden}
#sugg:empty{display:none}
#sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:11px 14px;font-weight:700;font-size:14px;text-align:left;cursor:pointer;color:var(--ink)}
#sugg button span{color:var(--muted);font-weight:600;font-size:12px;flex:none}
#sugg button:hover{background:#f3ecdb}
.none{padding:11px 14px;font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.stats{display:flex;gap:6px;pointer-events:auto;margin-left:auto}
.stat{background:var(--card);border-radius:14px;padding:6px 12px;text-align:center;box-shadow:var(--sh);min-width:66px}
.stat b{display:block;font-family:Unbounded,sans-serif;font-size:16px;font-weight:600}
.stat span{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat.online b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fb36b;margin-right:5px;vertical-align:3px;box-shadow:0 0 0 3px rgba(47,179,107,.2)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;background:var(--card);padding:6px;border-radius:18px;box-shadow:var(--sh);max-width:calc(100% - 24px);z-index:3}
.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:800;font-size:13px;cursor:pointer;background:#efe7d3;color:var(--ink);white-space:nowrap;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.primary{background:var(--acc);color:#fff}
.btn.warm{background:var(--acc2);color:#fff}
.btn.ai{background:linear-gradient(135deg,var(--ai1),var(--ai2));color:#fff}
.btn.danger{background:#f6dcd6;color:#9b2f22}
.btn.wide{width:100%;padding:13px}
.btn.sm{padding:8px 10px;font-size:12px;border-radius:10px}
.badge{display:inline-block;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#e5484d;color:#fff;font-size:11px;line-height:18px;margin-left:6px;text-align:center;vertical-align:1px}
.badge:empty{display:none}
.zoom{position:fixed;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:42px;height:42px;border:0;border-radius:12px;background:var(--card);font-weight:800;font-size:18px;box-shadow:var(--sh);cursor:pointer;color:var(--ink)}
.mode{position:fixed;left:12px;bottom:calc(82px + env(safe-area-inset-bottom));font-size:11px;font-weight:800;background:var(--card);padding:7px 10px;border-radius:10px;max-width:min(60%,300px);box-shadow:var(--sh);z-index:2;line-height:1.35}
.mode:empty{display:none}
.mode i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e0a526;margin-right:6px;vertical-align:1px}
#wallet{position:fixed;left:12px;top:calc(124px + env(safe-area-inset-top));display:flex;gap:6px;z-index:2}
#wallet button{border:0;background:var(--card);box-shadow:var(--sh);border-radius:12px;padding:10px 12px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink)}
#wallet #giftBtn{background:linear-gradient(135deg,#ffcf5a,#ff8a3d);color:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.panel{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(400px,calc(100% - 24px));max-height:calc(100% - 210px);overflow:auto;background:#fffdf7;border-radius:20px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.22);transition:opacity .2s,transform .2s;z-index:4}
.panel.hidden{opacity:0;pointer-events:none;transform:translate(-50%,14px)}
.ptag{font-weight:800;font-size:11px;color:var(--acc2);text-transform:uppercase;letter-spacing:.07em}
.panel h2{font-family:Unbounded,sans-serif;font-size:20px;font-weight:600;margin:4px 34px 6px 0;word-break:break-word}
.pmeta{font-size:13px;color:var(--muted);font-weight:700;line-height:1.6}
.pstatus{font-style:italic;font-weight:700;color:var(--ink);font-size:14px;margin-bottom:2px;word-break:break-word}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.badges span{background:#f1ead8;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;color:var(--ink)}
.pbtns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.pbtns>.btn{padding:10px 12px}
.pbtns:empty{display:none}
.adminrow{display:flex;gap:6px;flex-wrap:wrap;width:100%;padding-top:8px;margin-top:2px;border-top:1px dashed var(--line)}
.x{position:absolute;top:12px;right:12px;border:0;background:#efe7d3;width:30px;height:30px;border-radius:10px;cursor:pointer;font-size:15px;color:var(--ink)}
.modal{position:fixed;inset:0;background:rgba(20,30,30,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal.hidden{display:none}
.mcard{background:#fffdf7;border-radius:22px;padding:22px 20px 18px;width:min(430px,100%);max-height:88vh;overflow:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.mcard h3{font-family:Unbounded,sans-serif;font-size:18px;font-weight:600;margin:0 36px 6px 0;word-break:break-word}
.mcard h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc2);margin:18px 0 8px}
.mcard p{font-size:13px;color:var(--muted);margin:0 0 12px;font-weight:600;line-height:1.5}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:700 15px Manrope,sans-serif;margin-bottom:10px;background:#fff;color:var(--ink);outline:0}
.field:focus{border-color:var(--acc)}
.lbl{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:0 0 5px}
.err{color:#b44a3c;font-size:13px;font-weight:700;min-height:4px;margin-bottom:8px}
.ok{color:var(--acc)}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tabs{display:flex;background:#efe7d3;border-radius:12px;padding:3px;margin:4px 0 14px}
.tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:800;font-size:13px;cursor:pointer;color:var(--muted)}
.tabs.four button{font-size:12px;white-space:nowrap;padding:9px 2px}
.tabs button.on{background:#fffdf7;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.colors button{width:34px;height:34px;border-radius:10px;border:3px solid transparent;cursor:pointer;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)}
.colors button.on{border-color:var(--ink);transform:scale(1.08)}
.toplist button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:11px 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;cursor:pointer;text-align:left;color:var(--ink)}
.toplist button:hover{background:#f6f0e2}
.rank{font-family:Unbounded,sans-serif;width:30px;color:var(--acc2);flex:none}
.toplist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toplist .fl{color:var(--muted);font-size:12px;flex:none}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.hub{display:flex;flex-direction:column;gap:8px}
.hub .btn{text-align:left}
.hub p{font-size:12px;margin:-2px 2px 4px}
.balance{font-family:Unbounded,sans-serif;font-size:22px;font-weight:600;margin:2px 0 8px}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1.5px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;gap:5px;align-items:center;background:#fff}
.item .ic{font-size:30px;line-height:1.15}
.item b{font-size:13px}
.item small{font-size:11.5px;color:var(--muted);font-weight:700}
.item.own{background:#eef8f1;border-color:#bfe3c9}
ol.welcome{padding-left:22px;margin:4px 0 16px;font-weight:700;font-size:14px;line-height:1.8}
#toast{position:fixed;top:calc(178px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
#feed{position:fixed;right:12px;top:calc(124px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:flex-end;z-index:2;pointer-events:none}
#feed div{background:var(--card);box-shadow:var(--sh);padding:7px 11px;border-radius:11px;font-size:12px;font-weight:800;animation:slide .35s ease;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.chat{position:fixed;right:12px;top:calc(124px + env(safe-area-inset-top));bottom:calc(82px + env(safe-area-inset-bottom));width:min(370px,calc(100% - 24px));background:#fffdf7;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.24);display:flex;flex-direction:column;z-index:6;overflow:hidden}
.chat.hidden{display:none}
.chat header{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.chat header b{font-family:Unbounded,sans-serif;font-size:15px;font-weight:600}
.chat header span{font-size:12px;color:var(--muted);font-weight:700;flex:1}
.chat header .x{position:static;flex:none}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.msg{background:#f3ecdb;border-radius:14px;padding:7px 10px;max-width:88%;align-self:flex-start}
.msg.me{align-self:flex-end;background:#d9f0ec}
.msg .mname{border:0;background:none;padding:0;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}
.msg .mtime{font-size:10px;color:var(--muted);margin-left:6px;font-weight:700}
.msg .mdel{border:0;background:none;cursor:pointer;font-size:11px;margin-left:4px;opacity:.65;padding:0}
.msg .mtext{font-size:14px;font-weight:600;word-break:break-word;white-space:pre-wrap;margin-top:1px}
.msg.sys{align-self:center;text-align:center;max-width:96%;background:linear-gradient(135deg,rgba(109,74,255,.1),rgba(31,182,201,.1));font-size:11.5px;font-weight:700;padding:5px 10px;color:#3c3a5c}
.chat form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.chat form .field{margin:0;padding:11px 12px;font-size:14px}
.chatjoin{padding:12px;border-top:1px solid var(--line);text-align:center}
.chatjoin p{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--muted)}
.night .brand,.night .langs,.night #q,.night .stat,.night .bar,.night .zoom button,.night .mode,.night #wallet #walletBtn{background:rgba(24,32,48,.9);color:#eef2f7}
.night .brand p,.night .stat span,.night .langs button{color:#a9b4c4}
.night .langs button.on{background:#eef2f7;color:#182030}
.night .bar .btn:not(.primary):not(.warm):not(.ai){background:#2c3850;color:#eef2f7}
.night .searchbox svg{color:#eef2f7}
.night #feed div{background:rgba(24,32,48,.9);color:#eef2f7}
@media(max-width:560px){
  .stat{min-width:0;padding:6px 9px}.stats .stat:nth-child(2){display:none}
  h1{font-size:13px}.brand p{font-size:11px}
  .bar .btn{padding:10px 11px;font-size:12px}
  .mode{max-width:52%}
  #feed{display:none}
  .chat{left:0;right:0;top:0;bottom:0;width:auto;border-radius:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<header class="top">
  <div class="brand"><div class="logo">🤖</div><div><h1 id="title">AI Mahalla</h1><p id="tagline"></p></div></div>
  <div class="langs"><button data-l="uz">UZ</button><button data-l="ru">RU</button><button data-l="en">EN</button></div>
</header>

<div class="under">
  <div class="searchbox">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" autocomplete="off" maxlength="40" enterkeyhint="search">
    <div id="sugg"></div>
  </div>
  <div class="stats">
    <div class="stat"><b id="pop">0</b><span data-i="pop"></span></div>
    <div class="stat"><b id="towers">0</b><span data-i="towers"></span></div>
    <div class="stat online" id="onlineBox" hidden><b id="online">0</b><span data-i="online"></span></div>
  </div>
</div>
<div id="feed"></div>

<div class="zoom">
  <button id="zin" aria-label="+">+</button>
  <button id="zout" aria-label="−">−</button>
  <button id="zc" aria-label="center">◎</button>
  <button id="rot" aria-label="rotate" hidden>⟳</button>
  <button id="night" aria-label="night">🌙</button>
  <button id="v3d" aria-label="3D" hidden>2D</button>
</div>
<div id="mode" class="mode"></div>
<div id="wallet" hidden><button id="walletBtn"></button><button id="giftBtn" hidden>🎁</button></div>

<div id="panel" class="panel hidden">
  <button class="x" id="pClose">✕</button>
  <div class="ptag" id="pTag"></div>
  <h2 id="pName"></h2>
  <div class="pmeta" id="pMeta"></div>
  <div class="pbtns" id="pBtns"></div>
</div>

<nav class="bar">
  <button class="btn primary" id="bMine"></button>
  <button class="btn" id="bChat"><span data-i="chat"></span><span class="badge" id="chatBadge"></span></button>
  <button class="btn" id="bTop" data-i="top"></button>
  <button class="btn" id="bAdmin" hidden>⚙️</button>
</nav>

<aside id="chat" class="chat hidden">
  <header><b data-i="chatTitle"></b><span id="chatSub"></span><button class="x" id="chatClose">✕</button></header>
  <div id="msgs"></div>
  <form id="chatForm" autocomplete="off"><input id="chatIn" class="field" maxlength="200" enterkeyhint="send"><button class="btn primary" id="chatSend" type="submit">➤</button></form>
  <div id="chatJoin" class="chatjoin" hidden><p data-i="chatJoin"></p><button class="btn primary" id="chatJoinBtn" type="button" data-i="joinBtn"></button></div>
</aside>

<div id="modal" class="modal hidden"><div class="mcard" id="mcard"></div></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function lsJSON(k,d){try{const v=JSON.parse(lsGet(k));return v==null?d:v}catch(e){return d}}
let lang=["uz","ru","en"].includes(lsGet("lang"))?lsGet("lang"):((navigator.language||"").startsWith("ru")?"ru":"uz");
const t=k=>(T[lang]&&T[lang][k])||T.uz[k]||k;
const tf=(k,v={})=>t(k).replace(/\{(\w+)\}/g,(_,x)=>v[x]??"");
function el(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const k in attrs){const v=attrs[k];
    if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v!=null&&v!==false)e.setAttribute(k,v===true?"":v);}
  kids.flat().forEach(c=>c!=null&&c!==false&&e.append(c));return e;
}
const norm=s=>String(s||"").trim().replace(/^@/,"").toLowerCase();
function hash(str){let h=2166136261;str=String(str);for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function hash2(a,b){let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263);h=Math.imul(h^(h>>>13),1274126177);return(h^(h>>>16))>>>0}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let x=Math.imul(a^a>>>15,1|a);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296}}
let toastT;function toast(m,ms){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("on"),ms||2800)}
function feed(text){const f=$("#feed");const d=el("div",{text});f.prepend(d);while(f.children.length>4)f.lastChild.remove();setTimeout(()=>d.remove(),9000)}
const pad=n=>String(n).padStart(2,"0");
function fmtDate(ms){const d=new Date(ms);return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+d.getFullYear()}
function hhmm(ms){const d=new Date(ms),n=new Date(),hm=pad(d.getHours())+":"+pad(d.getMinutes());return d.toDateString()===n.toDateString()?hm:pad(d.getDate())+"."+pad(d.getMonth()+1)+" "+hm}
function fmtLeft(ms){const m=Math.ceil(ms/60000);if(m<60)return m+" "+t("min");const h=Math.floor(m/60);return h+" "+t("hour")+(m%60?" "+(m%60)+" "+t("min"):"")}

const CELL=44,ZONE=9;
const isRoad=g=>((g%5)+5)%5===0;
let plots=[],plotR=0;
function genPlots(R){const L=[];
  for(let gx=-R;gx<=R;gx++)for(let gy=-R;gy<=R;gy++){
    if(Math.abs(gx)<=ZONE+1&&Math.abs(gy)<=ZONE+1)continue;if(isRoad(gx)||isRoad(gy))continue;
    const d=Math.hypot(gx,gy);if(d>R)continue;L.push({gx,gy,d,a:Math.atan2(gy,gx)});}
  L.sort((p,q)=>p.d-q.d||p.a-q.a);plots=L;}
function ensurePlots(n){if(!plotR){plotR=16;genPlots(plotR)}while(plots.length<n+60){plotR+=6;genPlots(plotR)}}

function seed(){
  const fn=["Aziz","Malika","Sardor","Dilnoza","Jasur","Madina","Bekzod","Nilufar","Otabek","Shahzoda","Doston","Gulnora","Javohir","Sevara","Ulugbek","Kamola","Akmal","Zarina","Bobur","Mohira","Sherzod","Lola","Timur","Feruza","Islom","Nodira","Rustam","Yulduz","Anvar","Durdona","Asal","Behruz"];
  const sf=["","_uz","07","_tash","_99","bek","2008","_official","777","_sam","_x","01","_bukh",".dev"];
  const r=mulberry(42),out=[],seen=new Set();
  for(let i=0;i<240;i++){let n=fn[Math.floor(r()*fn.length)]+sf[Math.floor(r()*sf.length)];
    if(seen.has(n.toLowerCase()))n+=i;seen.add(n.toLowerCase());
    out.push({id:"s"+i,name:n,floors:r()<.15?Math.ceil(r()*14)*5:1,color:Math.floor(r()*8),slot:i,joined:1700000000000+i*3600e3});}
  return out;
}

const Demo=(()=>{
  const KEY="aimahalla-demo-v3";let d=null;
  const STATUSES=["Dasturchi 💻","Samarqanddan salom!","Osh ustasi 🍚","Futbol ishqibozi ⚽","Kitobxon 📚","Dizayner 🎨","Talaba 🎓","Sayohatchi ✈️","Choyxona doimiysi 🫖","AI bilan do'st 🤖"];
  const SAMPLE=["Assalomu alaykum, qo'shnilar! 👋","Bugun kim osh qilyapti? 🍚","Binom 40 qavat bo'ldi 😎","Choyxonada uchrashamizmi?","AI minora kechasi juda chiroyli ekan ✨","Bayroq oldim, zo'r ko'rinyapti 🇺🇿"];
  const day=ms=>{const x=new Date(ms);return x.getFullYear()+"-"+(x.getMonth()+1)+"-"+x.getDate()};
  const persist=()=>lsSet(KEY,JSON.stringify(d));
  function init(){
    if(d)return;d=lsJSON(KEY,null);if(d&&Array.isArray(d.users))return;
    const r=mulberry(7);
    const users=seed().map(u=>({...u,likes:Math.floor(r()*r()*30),invites:r()<.1?Math.ceil(r()*5):0,streak:r()<.3?Math.ceil(r()*9):0,
      decor:Object.keys(SHOP).filter(k=>r()<.14&&(!SHOP[k].minFloors||u.floors>=SHOP[k].minFloors)),status:r()<.35?STATUSES[Math.floor(r()*STATUSES.length)]:""}));
    const chat=[];const now=Date.now();
    SAMPLE.forEach((text,i)=>{const u=users[Math.floor(r()*40)];chat.push({uid:u.id,name:u.name,color:u.color,text,t:now-(7-i)*540e3})});
    chat.splice(2,0,{sys:true,kind:"milestone",name:users[3].name,uid:users[3].id,n:50,t:now-4000e3});
    chat.forEach((m,i)=>m.id=i+1);
    d={users,chat,seq:chat.length,nextSlot:users.length,me:null};persist();
  }
  const pubU=u=>({id:u.id,name:u.name,floors:u.floors,color:u.color,slot:u.slot,joined:u.joined,likes:u.likes||0,invites:u.invites||0,
    streak:u.id[0]==="s"?(u.streak||0):((u.lastGiftDay===day(Date.now())||u.lastGiftDay===day(Date.now()-864e5))?u.streak:0),decor:u.decor||[],status:u.status||""});
  const info=u=>({me:pubU(u),coins:u.coins,nextBuildAt:0,giftReady:u.lastGiftDay!==day(Date.now()),liked:u.liked,mutedUntil:0,step:STEP,maxFloors:MAXF,skipCost:SKIP});
  const fail=code=>{const e=new Error(code);e.code=code;throw e};
  const emit=m=>setTimeout(()=>onEvent(m),0);
  const push=m=>{m.id=++d.seq;m.t=Date.now();d.chat.push(m);if(d.chat.length>300)d.chat.splice(0,d.chat.length-300);emit({type:"chat",m})};
  const grow=u=>{const b=u.floors;u.floors=Math.min(MAXF,u.floors<=1?STEP:u.floors+STEP);for(let m=25;m<=MAXF;m+=25)if(b<m&&u.floors>=m)push({sys:true,kind:"milestone",name:u.name,uid:u.id,n:m})};
  async function handle(path,body){
    init();const isGet=body===undefined;body=body||{};
    const u=d.me?d.users.find(x=>x.id===d.me):null;
    switch(path){
      case "state":return{config:{title:"",tagline:""},residents:d.users.map(pubU),online:1,step:STEP,maxFloors:MAXF,shop:SHOP,skipCost:SKIP,chatLast:d.seq};
      case "chat":if(isGet)return{messages:d.chat.slice(-120)};break;
      case "me":if(!u)fail("auth");return info(u);
      case "join":{
        const name=String(body.name||"").trim().replace(/^@/,"");
        if(!/^[\p{L}\p{N}_.\-]{2,24}$/u.test(name))fail("name_invalid");
        if(!/^\d{4,8}$/.test(String(body.pin||"")))fail("pin_invalid");
        if(d.users.some(x=>norm(x.name)===norm(name)))fail("name_taken");
        const n={id:"u"+Date.now().toString(36),name,pin:String(body.pin),floors:1,color:(body.color|0)%8,slot:d.nextSlot++,joined:Date.now(),coins:200,likes:0,liked:[],invites:0,streak:0,lastGiftDay:"",decor:[],status:""};
        d.users.push(n);d.me=n.id;emit({type:"upsert",r:pubU(n)});push({sys:true,kind:"join",name:n.name,uid:n.id,n:n.slot+1});persist();
        return{token:"demo",...info(n)};}
      case "login":{const x=d.users.find(v=>v.pin&&norm(v.name)===norm(body.name));if(!x||x.pin!==String(body.pin||""))fail("bad_login");d.me=x.id;persist();return{token:"demo",...info(x)};}
      case "logout":d.me=null;persist();return{ok:true};
    }
    if(!u)fail("auth");
    switch(path){
      case "build":if(u.floors>=MAXF)fail("max");grow(u);break;
      case "color":u.color=(body.color|0)%8;break;
      case "gift":{const td=day(Date.now());if(u.lastGiftDay===td)fail("gift_taken");u.streak=u.lastGiftDay===day(Date.now()-864e5)?u.streak+1:1;
        const g=10+2*Math.min(u.streak,10);u.coins+=g;u.lastGiftDay=td;emit({type:"upsert",r:pubU(u)});persist();return{...info(u),gift:g};}
      case "like":{const tg=d.users.find(x=>x.id===body.id);if(!tg)fail("not_found");if(tg===u)fail("self");if(u.liked.includes(tg.id))fail("already");
        u.liked.push(tg.id);tg.likes=(tg.likes||0)+1;emit({type:"upsert",r:pubU(tg)});persist();return info(u);}
      case "buy":{const k=String(body.item||"");if(!Object.prototype.hasOwnProperty.call(SHOP,k))fail("bad_request");const it=SHOP[k];
        if(u.decor.includes(k))fail("owned");if(it.minFloors&&u.floors<it.minFloors)fail("need_floors");if(u.coins<it.price)fail("no_coins");u.coins-=it.price;u.decor.push(k);break;}
      case "status":u.status=String(body.text||"").replace(/\s+/g," ").trim().slice(0,50);break;
      case "chat":{const text=String(body.text||"").replace(/\s+/g," ").trim().slice(0,200);if(!text)fail("empty");push({uid:u.id,name:u.name,color:u.color,text});persist();return{ok:true};}
      default:fail("not_found");
    }
    emit({type:"upsert",r:pubU(u)});persist();return info(u);
  }
  return{handle};
})();

async function loadChat(){try{chatMsgs=(await call("chat")).messages||[]}catch(e){if(!chatMsgs)chatMsgs=[]}if(chatOpen){renderChat();markSeen()}}
async function openChat(){
  chatOpen=true;chatEl.classList.remove("hidden");closePanel();updateChatInput();setOnline(onlineN);
  if(!chatMsgs){msgsEl.replaceChildren(el("div",{class:"none",text:"…"}));await loadChat()}else{renderChat();markSeen()}
  if(mine()&&!matchMedia("(max-width:560px)").matches)chatIn.focus();
}
function closeChat(){chatOpen=false;chatEl.classList.add("hidden")}
function updateChatInput(){
  const logged=!!mine();$("#chatForm").hidden=!logged;$("#chatJoin").hidden=logged;
  const muted=me.mutedUntil>Date.now();chatIn.disabled=muted;chatIn.placeholder=muted?t("muted"):t("chatPh");
}
function onChatMsg(m){
  if(m.sys){
    if(!(m.kind==="join"&&m.uid===meId))feed("🤖 "+sysText(m));
    if(m.kind==="invite"&&m.uid===meId){toast(tf("gotInvite",{name:m.name2}));refreshMe()}
  }
  const own=!m.sys&&m.uid===meId;
  if(chatMsgs){
    if(chatMsgs.some(x=>x.id===m.id))return;
    chatMsgs.push(m);if(chatMsgs.length>300)chatMsgs.splice(0,chatMsgs.length-300);
    if(chatOpen){const atBottom=msgsEl.scrollHeight-msgsEl.scrollTop-msgsEl.clientHeight<80;
      if(msgsEl.querySelector(".none"))renderChat();else msgsEl.append(msgEl(m));
      if(atBottom||own)msgsEl.scrollTop=msgsEl.scrollHeight;markSeen();return}
  }
  if(!own){unread++;updateBadge()}
}
$("#bChat").onclick=()=>chatOpen?closeChat():openChat();
$("#chatClose").onclick=closeChat;
$("#chatJoinBtn").onclick=()=>openAuth("join");
$("#chatForm").addEventListener("submit",async e=>{e.preventDefault();const text=chatIn.value.trim();if(!text)return;const btn=$("#chatSend");btn.disabled=true;
  try{await call("chat",{text});chatIn.value=""}catch(err){toast(errText(err));if(err.code==="muted")refreshMe()}finally{btn.disabled=false;if(!chatIn.disabled)chatIn.focus()}});

/* ================= live events ================= */
function onEvent(m){
  switch(m.type){
    case "upsert":if(m.r)upsert(m.r);break;
    case "remove":residents=residents.filter(r=>r.id!==m.id);if(m.id===meId){meId=null;me=ME0();token="";lsSet("tok",null)}recompute();break;
    case "config":config=m.config||config;applyLang();break;
    case "online":setOnline(m.n);break;
    case "chat":if(m.m)onChatMsg(m.m);break;
    case "chat_del":if(chatMsgs){chatMsgs=chatMsgs.filter(x=>x.id!==m.id);if(chatOpen)renderChat()}break;
    case "chat_purge":if(chatMsgs){chatMsgs=chatMsgs.filter(x=>x.uid!==m.uid);if(chatOpen)renderChat()}break;
    case "like":if(m.to===meId){toast(tf("gotLike",{name:m.from}));refreshMe()}break;
    case "refresh_me":if(m.id===meId)refreshMe();break;
    case "reload":(async()=>{try{applyState(await call("state"));if(chatMsgs)loadChat();if(meId){try{setMe(await call("me"))}catch(e){if(e.code==="auth"){meId=null;me=ME0();token="";lsSet("tok",null);recompute()}}}}catch(e){}})();break;
  }
}
function setOnline(n){if(n==null)return;onlineN=n;$("#onlineBox").hidden=false;$("#online").textContent=n;$("#chatSub").textContent="· "+n+" "+t("online")}
function setMode(text){const m=$("#mode");m.replaceChildren();if(text)m.append(el("i"),document.createTextNode(text))}
function applyState(s){
  config=s.config||config;if(s.step)STEP=s.step;if(s.maxFloors)MAXF=s.maxFloors;if(s.skipCost)SKIP=s.skipCost;if(s.shop)SHOP=s.shop;
  setOnline(s.online);setResidents(s.residents||[]);
  if((s.chatLast||0)>chatSeen&&!chatOpen){dot=true;updateBadge()}
  applyLang();
}
function openEvents(){
  if(!window.EventSource)return;const es=new EventSource("/api/events");let dropped=false;
  es.onerror=()=>{dropped=true;setMode(t("offline"))};
  es.onopen=async()=>{setMode("");if(dropped){dropped=false;try{applyState(await call("state"));if(chatMsgs)loadChat();if(meId)refreshMe()}catch(e){}}};
  es.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}onEvent(m)};
}
async function start(){
  let s=null;
  try{s=await http("state");live=true}
  catch(e){if(serverPage){setMode(t("offline"));setTimeout(start,4000);return}}
  if(live){setMode("");applyState(s);openEvents()}
  else{s=await Demo.handle("state");applyState(s);setMode(t("demo"))}
  if(token||!live){try{setMe(await call("me"))}catch(e){if(e.code==="auth"){token="";lsSet("tok",null)}}}
  if(live&&adminToken){try{const ac=await call("admin/check",{},true);isAdmin=true;adminStorage=ac.storage||""}catch(e){if(e.code==="auth"){adminToken="";lsSet("adm",null)}}}
  if(isAdmin&&adminStorage==="ephemeral")setTimeout(()=>toast(t("storageWarn"),9000),1200);
  updateUI();if(selected)showRes(selected,true);
  if(live&&(/[?&]admin\b/.test(location.search)||location.hash==="#admin"))isAdmin?openAdmin():openAdminLogin();
  const params=new URLSearchParams(location.search),want=params.get("u")||params.get("ref");
  if(want&&!mine())lsSet("ref",want);
  const target=want?residents.find(r=>norm(r.name)===norm(want)):mine();
  if(target)setTimeout(()=>focusRes(target),350);
  if(!lsGet("welcomed")&&!mine()&&modal.classList.contains("hidden"))setTimeout(openWelcome,target?1400:600);
}

/* ================= language ================= */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  const ttl=config.title||t("title");$("#title").textContent=ttl;document.title=ttl;
  $("#tagline").textContent=config.tagline||t("tagline");q.placeholder=t("search");
  if(!live&&$("#mode").childNodes.length)setMode(serverPage?t("offline"):t("demo"));
  setOnline(onlineN);updateUI();if(chatOpen)renderChat();req();
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;lsSet("lang",lang);applyLang();if(selected)showRes(selected,true)});

try{use3D=!!window.THREE&&lsGet("view")!=="2d"&&V3.init()}catch(e){console.error(e);use3D=false}
if(!use3D){const g=document.getElementById("gl"),o=document.getElementById("ov");if(g)g.remove();if(o)o.remove();cv.style.display=""}
if(use3D&&!lsGet("hint3d")){lsSet("hint3d","1");setTimeout(()=>toast(matchMedia("(pointer:coarse)").matches?t("hint3dTouch"):t("hint3dMouse"),6500),2600)}
$("#rot").hidden=!use3D;$("#v3d").hidden=!window.THREE;$("#v3d").textContent=use3D?"2D":"3D";
resize();applyNight();applyLang();ensurePlots(0);requestAnimationFrame(loop);start();
setInterval(()=>{if(nightPref==null)applyNight()},60000);
setInterval(()=>{if(meId&&live)refreshMe()},600000);
})();
</script>
